<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>白块光源</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #patch { position: absolute; background: #fff; }
  #help { position: absolute; left: 16px; bottom: 16px; color: #888; font: 14px/1.6 sans-serif; }
</style>
</head>
<body>
<div id="patch"></div>
<div id="help">
  F11 全屏 · ← → ↑ ↓ 移动 · + / − 改大小 · L / R 贴左边 / 右边 · H 隐藏说明<br>
  <span id="info"></span>
</div>
<script>
// 27" 16:9 panel is 59.8 cm wide; at 1920 px that is about 0.311 mm per CSS pixel
// (only exact with browser zoom 100% and Windows scaling 100%).
const MM_PER_PX = 597.7 / 1920;
let sizeCm = 25, side = "R", dx = 0, dy = 0;
const patch = document.getElementById("patch"), info = document.getElementById("info");

function draw() {
  const s = Math.min(Math.round(sizeCm * 10 / MM_PER_PX), window.innerHeight);
  const x0 = side === "R" ? window.innerWidth - s : 0;
  patch.style.width = patch.style.height = s + "px";
  patch.style.left = Math.max(0, Math.min(window.innerWidth - s, x0 + dx)) + "px";
  patch.style.top = Math.max(0, Math.min(window.innerHeight - s, (window.innerHeight - s) / 2 + dy)) + "px";
  info.textContent = `白块约 ${(s * MM_PER_PX / 10).toFixed(1)} cm 见方（按 27 英寸 1080p 估算）`;
}

addEventListener("keydown", e => {
  const step = e.shiftKey ? 50 : 10;
  if (e.key === "ArrowLeft") dx -= step;
  else if (e.key === "ArrowRight") dx += step;
  else if (e.key === "ArrowUp") dy -= step;
  else if (e.key === "ArrowDown") dy += step;
  else if (e.key === "+" || e.key === "=") sizeCm = Math.min(34, sizeCm + 1);
  else if (e.key === "-") sizeCm = Math.max(3, sizeCm - 1);
  else if (e.key === "l" || e.key === "L") { side = "L"; dx = 0; }
  else if (e.key === "r" || e.key === "R") { side = "R"; dx = 0; }
  else if (e.key === "h" || e.key === "H") document.getElementById("help").hidden ^= true;
  else return;
  e.preventDefault();
  draw();
});
addEventListener("resize", draw);
draw();
</script>
</body>
</html>
